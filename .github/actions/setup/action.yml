name: setup
description: JDK 17, Android build-tools 36 and platform-tools on PATH, cached build inputs (android.jar, test libs, native deps)
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with: { distribution: temurin, java-version: '17' }
    - name: Android build-tools and platform-tools
      shell: bash
      run: |
        SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        { yes | "$SDKM" --licenses >/dev/null 2>&1; } || true
        "$SDKM" "build-tools;36.0.0" "platform-tools" >/dev/null || sudo "$SDKM" "build-tools;36.0.0" "platform-tools" >/dev/null
        echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
    - uses: actions/cache@v4
      with:
        path: .cache
        key: inputs-v1-${{ hashFiles('tools/setup.sh', 'tools/setup-native.sh', 'version.properties') }}
    - name: Build inputs
      shell: bash
      run: bash tools/setup.sh
