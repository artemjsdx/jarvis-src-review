# CI for Jarvis: the same Termux-style pipeline (aapt2 + javac + d8 + zipalign + apksigner, no Gradle) on a Linux runner,
# JVM tests, and an Android emulator job that installs the APK and drives it through its MCP bridge (screenshots + health report as artifacts).
#
# Secrets (repo settings):
#   JARVIS_KEYSTORE_B64 / JARVIS_KEYSTORE_PASS  the release signing key: with it the APK can update the app already installed on the phone
#   JARVIS_BRIDGE_B64                            provisioned-bridge.json: MCP bridge token + neutral defaults (NO api keys)
#   OPENROUTER_KEY                               optional: the emulator job runs one live LLM round trip (tools/ci/llm-roundtrip.py)
# Without them the jobs still run with throw-away values (APK then cannot update the installed app).
name: ci
on:
  push: { branches: [master, main] }
  workflow_dispatch:
    inputs:
      emulator: { description: "Also run the Android emulator job", type: boolean, default: false }
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  apk:
    name: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Signing key
        env:
          JARVIS_KEYSTORE_B64: ${{ secrets.JARVIS_KEYSTORE_B64 }}
          JARVIS_KEYSTORE_PASS: ${{ secrets.JARVIS_KEYSTORE_PASS }}
        run: bash tools/ci/signing-key.sh
      - name: Bridge APK (arm64, for the phone)
        env:
          BRIDGE_B64: ${{ secrets.JARVIS_BRIDGE_B64 }}
          EXPECT_CERT_SHA256: ${{ secrets.JARVIS_KEYSTORE_B64 != '' && '15269ebcc3d579f39b4abf3739096a2013d737c9c4dab067b92d0e3d3d38f9cf' || '' }}
        run: bash tools/ci/build-bridge.sh device
      - name: Emulator APK (same code, x86_64 native libs)
        env:
          BRIDGE_B64: ${{ secrets.JARVIS_BRIDGE_B64 }}
        run: bash tools/ci/build-bridge.sh emu
      - name: Debug APK (also compiles the debug-only sources)
        run: JV_APK_OUT="$PWD/build/outputs/Jarvis-debug.apk" bash build.sh debug
      - name: Publish the APKs as release assets (artifact storage of the account is full)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash tools/ci/publish.sh ci-apk "CI build ${{ github.run_number }} (${{ github.sha }})" build/outputs/Jarvis.apk build/outputs/Jarvis-emulator.apk build/outputs/Jarvis-debug.apk

  tests:
    name: jvm tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: adb for the interop tests
        run: |
          sudo ln -sf "$ANDROID_HOME/platform-tools/adb" /usr/bin/adb
          mkdir -p "$HOME/.android"
          adb keygen "$HOME/.android/adbkey" || true
      - name: JVM tests
        run: |
          mkdir -p build
          bash tools/run-tests.sh 2>&1 | tee build/tests.log
          exit "${PIPESTATUS[0]}"
      - if: always()
        name: Test summary
        run: |
          { echo '### JVM tests'; echo '```'; tail -n 25 build/tests.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  emulator:
    name: emulator smoke (MCP bridge)
    needs: apk
    permissions: { contents: write }
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.emulator) || contains(github.event.head_commit.message || '', '[emu]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Get the emulator APK built by the apk job
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG=ci-apk; if [ "$GITHUB_REF_NAME" != master ] && [ "$GITHUB_REF_NAME" != main ]; then TAG="ci-apk-${GITHUB_REF_NAME//\//-}"; fi
          gh release download "$TAG" --pattern 'Jarvis-emulator.apk' --dir build/emu-in
      - name: Bridge token for the test client
        env:
          BRIDGE_B64: ${{ secrets.JARVIS_BRIDGE_B64 }}
        run: |
          mkdir -p "$HOME/.jarvis-keys"
          printf '%s' "$BRIDGE_B64" | base64 -d > "$HOME/.jarvis-keys/provisioned-bridge.json"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || echo "NO /dev/kvm: the emulator will be very slow"
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 576M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/ci/emulator-smoke.sh "$(ls build/emu-in/*.apk | head -n1)" build/emu
      - if: always()
        run: cat build/emu/summary.txt >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        name: Publish the emulator report (screenshots, journal, logcat)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd build && zip -qr emulator-report.zip emu && cd ..
          bash tools/ci/publish.sh ci-emulator "Emulator report, run ${{ github.run_number }}" build/emulator-report.zip
